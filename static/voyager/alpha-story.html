<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Edition scene editor</title>
		<style>
			html,
			body {
				height: 100%;
				margin: 0;
				background: #303030;
				color: white;
				font: 14px sans-serif;
			}
			#loading {
				padding: 24px;
			}
			body {
				display: flex;
				flex-direction: column;
			}
			voyager-story {
				position: relative;
				display: block;
				flex: 1;
				min-height: 0;
			}
		</style>
	</head>
	<body>
		<p id="loading">Loading Voyager Story…</p>
		<script type="module">
			import { mountAnimationControls } from './animation-controls.js';
			const session = new URLSearchParams(location.search).get('session');
			let app;
			let animations;
			let started = false;
			const pendingFiles = new Map();
			const mediaPreviews = new Map();
			const previewPaths = new Map();
			let writeError = '';
			const send = (type, data = {}) =>
				parent.postMessage({ type, session, ...data }, location.origin);
			// Story's toolbar normally writes to WebDAV. Route its scene Save through the same
			// authenticated scene-and-article save as the surrounding editor instead.
			document.addEventListener(
				'click',
				(event) => {
					const button = event.target.closest?.('ff-button');
					if (button?.getAttribute('text') !== 'Save') return;
					event.preventDefault();
					event.stopImmediatePropagation();
					send('save-request');
				},
				{ capture: true }
			);
			addEventListener('message', async (event) => {
				if (
					event.source !== parent ||
					event.origin !== location.origin ||
					!session ||
					event.data?.session !== session
				)
					return;
				try {
					if (event.data.type === 'init' && !started) {
						started = true;
						const {
							root,
							resourceRoot,
							document: scene,
							model,
							title,
							assets,
							companionFiles = []
						} = event.data;
						const directory = new URL(root || '/', location.href);
						const folders = new Set(['', 'articles/']);
						const xml = (value) =>
							String(value).replace(
								/[<>&"']/g,
								(character) =>
									({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;', "'": '&apos;' })[
										character
									]
							);
						const listing = (path) => {
							const paths = new Set([
								...folders,
								...Object.keys(assets),
								...[...pendingFiles.values()].map((entry) => entry.path)
							]);
							for (const entry of [...paths]) {
								const parts = entry.split('/');
								parts.pop();
								while (parts.length) {
									paths.add(parts.join('/') + '/');
									parts.pop();
								}
							}
							const date = new Date().toUTCString();
							const responses = [...paths]
								.filter((entry) => entry === path || entry.startsWith(path))
								.map((entry) => {
									const folder = !entry || entry.endsWith('/');
									const name = entry.split('/').filter(Boolean).pop() || 'Edition files';
									const type = /\.html?$/i.test(entry)
										? 'text/html'
										: /\.png$/i.test(entry)
											? 'image/png'
											: /\.jpe?g$/i.test(entry)
												? 'image/jpeg'
												: 'application/octet-stream';
									return `<d:response><d:href>${xml(new URL(entry, directory).pathname)}</d:href><d:propstat><d:prop><d:displayname>${xml(name)}</d:displayname><d:creationdate>${xml(date)}</d:creationdate><d:getlastmodified>${xml(date)}</d:getlastmodified><d:getcontentlength>0</d:getcontentlength><d:getcontenttype>${type}</d:getcontenttype><d:resourcetype>${folder ? '<d:collection/>' : ''}</d:resourcetype></d:prop><d:status>HTTP/1.1 200 OK</d:status></d:propstat></d:response>`;
								});
							return new Response(
								`<d:multistatus xmlns:d="DAV:">${responses.join('')}</d:multistatus>`,
								{ status: 207, headers: { 'Content-Type': 'application/xml' } }
							);
						};
						const publicSuffix = (url) => {
							const params = new URLSearchParams(url.search);
							params.delete('token');
							for (const [key, value] of [...params])
								if (/^\d+$/.test(key) && !value) params.delete(key);
							return { params, hash: url.hash };
						};
						const persistentHtml = (html, articleUrl) => {
							const parsed = new DOMParser().parseFromString(html, 'text/html');
							for (const element of parsed.querySelectorAll('[src], [href], [poster]')) {
								for (const attribute of ['src', 'href', 'poster']) {
									const value = element.getAttribute(attribute);
									if (!value || value.startsWith('#')) continue;
									const previewPath =
										previewPaths.get(value) ||
										(value.startsWith('data:')
											? previewPaths.get(value.replace(/\?\d+$/, ''))
											: null);
									if (previewPath) {
										element.setAttribute(attribute, previewPath);
										continue;
									}
									const url = new URL(value, articleUrl);
									if (
										url.origin === directory.origin &&
										url.pathname.startsWith(directory.pathname)
									) {
										const { params, hash } = publicSuffix(url);
										element.setAttribute(
											attribute,
											decodeURIComponent(url.pathname.slice(directory.pathname.length)) +
												(params.size ? '?' + params : '') +
												hash
										);
									}
								}
							}
							for (const element of parsed.querySelectorAll('*')) {
								for (const attribute of [...element.attributes]) {
									if (attribute.name.startsWith('data-mce-'))
										element.removeAttribute(attribute.name);
								}
							}
							return parsed.body.innerHTML;
						};
						const readableHtml = (html) => {
							const parsed = new DOMParser().parseFromString(html, 'text/html');
							for (const element of parsed.querySelectorAll('[src], [href], [poster]')) {
								for (const attribute of ['src', 'href', 'poster']) {
									const value = element.getAttribute(attribute);
									if (!value || value.startsWith('#')) continue;
									const url = new URL(value, directory);
									const name = decodeURIComponent(url.pathname.split('/').pop());
									if (
										url.origin === directory.origin &&
										url.pathname.startsWith(directory.pathname) &&
										assets[name]
									) {
										const mapped = new URL(assets[name]);
										const { params, hash } = publicSuffix(url);
										for (const [key, value] of params) mapped.searchParams.append(key, value);
										mapped.hash = hash;
										element.setAttribute(attribute, mapped.href);
									}
								}
							}
							return parsed.body.innerHTML;
						};
						const resources = new URL(resourceRoot, location.href);
						if (
							resources.origin !== location.origin ||
							!/\/voyager\/\d+\.\d+\.\d+\/$/.test(resources.pathname)
						)
							throw new Error('Invalid Voyager runtime.');
						const originalFetch = window.fetch.bind(window);
						window.fetch = async (input, init) => {
							const url =
								typeof input === 'string' ? input : input instanceof URL ? input.href : input.url;
							const name = decodeURIComponent(
								new URL(url, location.href).pathname.split('/').pop()
							);
							const normalized = name
								.replace(/([a-z0-9])([A-Z])/g, '$1_$2')
								.replace(/([A-Z])([A-Z][a-z])/g, '$1_$2')
								.toLowerCase()
								.replace(/[^a-z0-9.]+/g, '_');
							const mapped = assets[name] || assets[normalized];
							const requestedUrl = new URL(url, location.href);
							const resolvedUrl = new URL(mapped || url, location.href);
							const owned =
								resolvedUrl.origin === directory.origin &&
								resolvedUrl.pathname.startsWith(directory.pathname);
							const key = owned
								? decodeURIComponent(resolvedUrl.pathname.slice(directory.pathname.length))
								: '';
							const method = (
								init?.method || (input instanceof Request ? input.method : 'GET')
							).toUpperCase();
							if (method === 'PROPFIND' && owned) return listing(key);
							if (
								method === 'MKCOL' &&
								owned &&
								/^[-\w/ ]+\/?$/.test(key) &&
								!key.split('/').includes('..')
							) {
								folders.add(key.replace(/\/?$/, '/'));
								return new Response(null, { status: 201 });
							}
							if (method === 'PUT') {
								try {
									if (
										!owned ||
										requestedUrl.origin !== directory.origin ||
										!requestedUrl.pathname.startsWith(directory.pathname)
									)
										throw new Error(
											'Voyager can only change this edition’s article and media files.'
										);
									const path = decodeURIComponent(
										requestedUrl.pathname.slice(directory.pathname.length)
									);
									if (
										!/^[-\w./ ]+$/.test(path) ||
										path.split('/').some((part) => !part || part === '.' || part === '..') ||
										!/\.(html?|png|jpe?g|webp|gif|avif|mp3|wav|ogg|mp4|webm|vtt)$/i.test(path)
									)
										throw new Error('This article or media filename is not supported.');
									let blob = await new Request(input, init).blob();
									if (/\.html?$/i.test(path)) {
										if (blob.size > 100 * 1024 * 1024)
											throw new Error('Article editor content is too large.');
										blob = new Blob([persistentHtml(await blob.text(), requestedUrl)], {
											type: 'text/html'
										});
										if (blob.size > 5 * 1024 * 1024)
											throw new Error('Articles must be 5 MB or smaller.');
									}
									const total = [...pendingFiles.entries()].reduce(
										(sum, [name, entry]) => sum + (name === key ? 0 : entry.file.size),
										blob.size
									);
									if (
										total > 50 * 1024 * 1024 ||
										(!pendingFiles.has(key) && pendingFiles.size >= 100)
									)
										throw new Error('Save up to 100 changed files and 50 MB of media at a time.');
									pendingFiles.set(key, {
										path,
										original: companionFiles.includes(key) ? key : null,
										file: new File([blob], path.split('/').pop(), { type: blob.type })
									});
									const extension = path.split('.').pop().toLowerCase();
									const imageType = {
										png: 'image/png',
										jpg: 'image/jpeg',
										jpeg: 'image/jpeg',
										gif: 'image/gif',
										webp: 'image/webp',
										avif: 'image/avif'
									}[extension];
									if (imageType) {
										const preview = await new Promise((resolve, reject) => {
											const reader = new FileReader();
											// Story appends a numeric cache buster. Keep it in the fragment,
											// not in the base64 image payload.
											reader.onload = () => resolve(reader.result + '#voyager-preview');
											reader.onerror = () =>
												reject(new Error('Could not preview the uploaded image.'));
											reader.readAsDataURL(new Blob([blob], { type: imageType }));
										});
										if (mediaPreviews.has(key)) previewPaths.delete(mediaPreviews.get(key));
										mediaPreviews.set(key, preview);
										previewPaths.set(preview, path);
									}
									send('dirty');
									return new Response(null, { status: 200 });
								} catch (error) {
									writeError = error.message || 'Could not prepare article or media changes.';
									send('error', { message: writeError });
									throw error;
								}
							}
							if (!['GET', 'HEAD'].includes(method))
								throw new Error('Use Save scene & close to save changes to this edition.');
							if (owned && pendingFiles.has(key)) {
								const file = pendingFiles.get(key).file;
								return new Response(
									method === 'HEAD'
										? null
										: /\.html?$/i.test(key)
											? readableHtml(await file.text())
											: file
								);
							}
							const response = await originalFetch(mapped || input, init);
							if (owned && method === 'GET' && /\.html?$/i.test(name) && response.ok)
								return new Response(readableHtml(await response.text()), {
									headers: { 'Content-Type': 'text/html' }
								});
							if (
								!title ||
								!scene ||
								new URL(url, location.href).href !== new URL(scene, location.href).href
							)
								return response;
							const document = await response.clone().json();
							const scenes = Array.isArray(document.scenes) ? document.scenes : [];
							const sceneIndex = typeof document.scene === 'number' ? document.scene : 0;
							const activeScene = scenes[sceneIndex];
							if (!activeScene || typeof activeScene !== 'object') return response;
							const metas = Array.isArray(document.metas) ? document.metas : [];
							let metaIndex = typeof activeScene.meta === 'number' ? activeScene.meta : -1;
							if (!metas[metaIndex] || typeof metas[metaIndex] !== 'object') {
								metaIndex = metas.length;
								activeScene.meta = metaIndex;
								metas.push({});
							}
							const setup = document.setups?.[activeScene.setup];
							const language = setup?.language?.language;
							{
								const meta = metas[metaIndex];
								meta.collection ||= {};
								meta.collection.titles = { ...(meta.collection.titles || {}), EN: title };
								if (typeof language === 'string' && language)
									meta.collection.titles[language.toUpperCase()] = title;
							}
							document.metas = metas;
							return new Response(JSON.stringify(document), {
								status: response.status,
								headers: { 'content-type': 'application/json' }
							});
						};
						for (const path of ['fonts/fonts.css', 'css/voyager-story.min.css']) {
							const link = document.createElement('link');
							link.rel = 'stylesheet';
							link.href = new URL(path, resources).href;
							document.head.append(link);
						}
						await new Promise((resolve, reject) => {
							const script = document.createElement('script');
							script.src = new URL('js/voyager-story.min.js', resources).href;
							script.onload = resolve;
							script.onerror = () => reject(new Error('Could not load Voyager Story.'));
							document.head.append(script);
						});
						document.getElementById('loading').remove();
						// Initialize the application before attaching Story's panels and mode listeners.
						app = new window.VoyagerStory(null, {
							resourceRoot: resources.href,
							mode: 'author',
							expert: false
						});
						app.setBaseUrl(root || location.origin + '/');
						const originalAssetUrl = app.assetManager.getAssetUrl.bind(app.assetManager);
						app.assetManager.getAssetUrl = (path) => {
							const original = originalAssetUrl(path);
							const url = new URL(original, directory);
							if (url.origin !== directory.origin || !url.pathname.startsWith(directory.pathname))
								return original;
							const name = decodeURIComponent(url.pathname.split('/').pop());
							const mapped = assets[name];
							const resolved = new URL(mapped || original, directory);
							const key = decodeURIComponent(resolved.pathname.slice(directory.pathname.length));
							return mediaPreviews.get(key) || mapped || original;
						};
						const StoryView = customElements.get('voyager-story');
						const view = new StoryView(app);
						view.style.height = '0';
						view.style.position = 'relative';
						document.body.append(view);
						const animationHost = document.createElement('div');
						document.body.insertBefore(animationHost, view);
						animations = mountAnimationControls(app, animationHost, {
							editable: true,
							onchange: () => send('dirty')
						});
						if (scene && title) {
							const response = await window.fetch(scene);
							if (!response.ok) throw new Error(`Could not load scene (${response.status}).`);
							const runtimeScene = URL.createObjectURL(await response.blob());
							try {
								await app.loadDocument(runtimeScene);
							} finally {
								URL.revokeObjectURL(runtimeScene);
							}
						} else if (scene) await app.loadDocument(scene);
						else if (/\.(obj|ply)(\?|$)/i.test(model)) await app.loadGeometry(model);
						else if (model) await app.loadModel(model, 'High');
						if (title) {
							const activeDocument = app.documentProvider?.activeComponent;
							activeDocument?.ins?.title?.setValue(title);
							activeDocument?.update?.();
						}
						if (!app.documentProvider?.activeComponent?.deflateDocument)
							throw new Error('This Voyager version cannot save scenes through the editor.');
						// The embedded loader does not run Story's normal root-ready callback. Its
						// media browser reads the scoped in-memory listing provided above instead.
						app.assetManager.ins.baseUrlValid.setValue(true);
						await app.mediaManager.refresh();
						animations.refresh();
						send('ready');
						// Mark interactions as potentially unsaved; never discard scene work silently.
						for (const type of ['input', 'change', 'pointerdown'])
							document.addEventListener(type, () => send('dirty'), { capture: true });
					} else if (event.data.type === 'export' && app) {
						// TinyMCE keeps the active article outside the scene JSON. Flush it through the
						// staged writer before collecting both the scene and its companion files.
						writeError = '';
						for (const editor of document.querySelectorAll('sv-article-editor')) {
							if (
								editor._assetPath &&
								window.tinymce?.activeEditor?.isDirty() &&
								typeof editor.writeArticle === 'function'
							)
								await editor.writeArticle();
						}
						if (writeError) throw new Error(writeError);
						animations?.prepareSave();
						await new Promise(requestAnimationFrame);
						send('document', {
							document: app.documentProvider.activeComponent.deflateDocument(),
							files: [...pendingFiles.values()]
						});
					}
				} catch (error) {
					send('error', { message: error.message || 'Scene editor failed.' });
				}
			});
			addEventListener('pagehide', () => animations?.dispose(), { once: true });
		</script>
	</body>
</html>
