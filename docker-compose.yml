services:
  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    ports:
      - '127.0.0.1:${MINIO_API_PORT:-60023}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-60024}:9001'
    volumes:
      - ./minio/data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-pure3d}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?Set a private local MinIO password in .env}
    command: server /data --console-address ':9001'
    restart: unless-stopped

  minio-setup:
    image: minio/mc:latest
    depends_on:
      - minio
    volumes:
      - ./:/app:ro
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-pure3d}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?Set a private local MinIO password in .env}
      - R2_BUCKET=${R2_BUCKET:-pure3d-assets}
    entrypoint: ['/bin/sh', '/app/scripts/setup-minio.sh']
    restart: 'no'

  pocketbase:
    image: ghcr.io/muchobien/pocketbase:0.40.3@sha256:ab3f2357cce759aa8ccd4863ac49f07060ce4a12097d3cac52ac519d6ca68ecc
    ports:
      - '127.0.0.1:${POCKETBASE_PORT:-60021}:8090'
    volumes:
      - ./pocketbase/pb_data:/pb/pb_data
      - ./pocketbase/pb_hooks:/pb/pb_hooks:ro
      - ./pocketbase-entrypoint.sh:/entrypoint.sh:ro
    environment:
      - POCKETBASE_ADMIN_EMAIL=${POCKETBASE_ADMIN_EMAIL:-admin@admin.local}
      - POCKETBASE_ADMIN_PASSWORD=${POCKETBASE_ADMIN_PASSWORD:?Set a private local PocketBase password in .env}
      - PUBLIC_POCKETBASE_URL=${PUBLIC_POCKETBASE_URL:-http://localhost:60021}
      - ORCID_ISSUER=${ORCID_ISSUER:-https://orcid.org}
      - SMTP_ENABLED=${SMTP_ENABLED:-false}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:8090/api/health']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    entrypoint: ['/bin/sh', '/entrypoint.sh']
    command: ['pocketbase', 'serve', '--http=0.0.0.0:8090', '--dir=/pb/pb_data']

  pocketbase-setup:
    image: oven/bun:1
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      - POCKETBASE_URL=http://pocketbase:8090
      - PUBLIC_POCKETBASE_URL=${PUBLIC_POCKETBASE_URL:-http://localhost:60021}
      - POCKETBASE_ADMIN_EMAIL=${POCKETBASE_ADMIN_EMAIL:-admin@admin.local}
      - POCKETBASE_ADMIN_PASSWORD=${POCKETBASE_ADMIN_PASSWORD:?Set a private local PocketBase password in .env}
      - R2_ENDPOINT=${R2_ENDPOINT:-http://minio:9000}
      - R2_BUCKET=${R2_BUCKET:-pure3d-assets}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-pure3d}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:?Set a private local MinIO password in .env}}
    depends_on:
      minio-setup:
        condition: service_completed_successfully
      pocketbase:
        condition: service_healthy
    command: sh -c "bun install && bun scripts/create-pocketbase-collections.ts && bun scripts/migrate-documentation.ts && bun scripts/import-data.ts --onboarding-dir /app/data/import-onboarding"
    restart: 'no'

  voyager-setup:
    image: alpine:3.20
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      - VOYAGER_VERSION=${VOYAGER_VERSION:-latest}
    command: sh /app/scripts/install-voyager-runtime.sh
    restart: 'no'

  frontend:
    image: oven/bun:1
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-60020}:14273'
    environment:
      - PUBLIC_POCKETBASE_URL=${PUBLIC_POCKETBASE_URL:-http://localhost:60021}
      - PUBLIC_ASSET_BASE_URL=${PUBLIC_ASSET_BASE_URL:-http://localhost:60023/pure3d-assets}
    depends_on:
      minio-setup:
        condition: service_completed_successfully
      pocketbase:
        condition: service_healthy
      pocketbase-setup:
        condition: service_completed_successfully
      voyager-setup:
        condition: service_completed_successfully
    command: sh -c "bun install && bun run dev --host --port 14273"
    restart: unless-stopped
